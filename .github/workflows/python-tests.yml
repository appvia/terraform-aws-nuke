---
name: Python Tests
on:
  push:
    branches:
      - main
    paths:
      - assets/docker/handler.py
      - assets/docker/test_handler.py
  pull_request:
    branches:
      - main
    paths:
      - assets/docker/handler.py
      - assets/docker/test_handler.py

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip3 install pytest

      - name: Run Tests
        working-directory: assets/docker
        run: python3 -m pytest test_handler.py -v
